[project]
name = "openenv-email-triage"
version = "0.1.0"
description = "OpenEnv Email Triage Benchmark"
authors = [
  { name="Mahir Shah" }
]
dependencies = [
  "pydantic>=2.0.0",
  "PyYAML",
  "openai>=1.0.0",
  "fastapi",
  "uvicorn",
  "openenv-core>=0.2.0"
]

[project.scripts]
server = "app:app"

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
